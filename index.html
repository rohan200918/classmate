<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classmate - Attendance Tracker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #111827;
}

header {
  background: #ffffff;
  padding: 20px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-content {
  max-width: 700px;
  margin: auto;
}

.logo {
  font-size: 27px;
  font-weight: 800;
}

.subtitle {
  color: #6b7280;
  font-size: 14px;
  margin-top: 4px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px 16px 100px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

h2 {
  font-size: 20px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #111827;
}

button {
  border: none;
  border-radius: 11px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #111827;
  color: white;
}

.add-btn {
  width: 100%;
  background: #111827;
  color: white;
  margin-top: 5px;
}

.subject {
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 16px;
  margin-top: 14px;
}

.subject-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.subject-name {
  font-size: 18px;
  font-weight: 700;
}

.delete {
  background: #f3f4f6;
  color: #374151;
  padding: 7px 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.stat {
  background: #f8fafc;
  padding: 12px 5px;
  border-radius: 10px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 18px;
}

.stat span {
  font-size: 11px;
  color: #6b7280;
}

.percentage {
  text-align: center;
  font-size: 25px;
  font-weight: 800;
  margin-top: 15px;
}

.attendance-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.present {
  background: #111827;
  color: white;
}

.absent {
  background: #e5e7eb;
  color: #111827;
}

.history {
  margin-top: 14px;
  font-size: 13px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #f0f0f0;
}

.empty {
  color: #6b7280;
  text-align: center;
  padding: 15px 0;
}

.overall-number {
  font-size: 38px;
  font-weight: 800;
  text-align: center;
}

.warning {
  color: #b45309;
  text-align: center;
  margin-top: 6px;
  font-size: 13px;
}

.success {
  color: #15803d;
  text-align: center;
  margin-top: 6px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">📚 Classmate</div>
    <div class="subtitle">Smart Student Attendance Tracker</div>
  </div>
</header>

<main>

  <div class="card">
    <h2>Student Profile</h2>

    <input id="studentName" placeholder="Student Name">
    <input id="collegeName" placeholder="College Name">
    <input id="rollNumber" placeholder="Roll Number">

    <button class="primary" onclick="saveProfile()">Save Profile</button>
  </div>

  <div class="card">
    <h2>Overall Attendance</h2>

    <div class="overall-number" id="overall">0%</div>
    <div id="overallMessage" class="empty">
      Add attendance to see your overall percentage.
    </div>
  </div>

  <div class="card">
    <h2>My Subjects</h2>

    <input id="subjectInput" placeholder="Enter subject name">

    <button class="add-btn" onclick="addSubject()">+ Add Subject</button>

    <div id="subjects"></div>
  </div>

</main>

<script>

let data = JSON.parse(localStorage.getItem("classmateData")) || {
  profile: {
    name: "",
    college: "",
    roll: ""
  },
  subjects: []
};

function saveData() {
  localStorage.setItem("classmateData", JSON.stringify(data));
}

function loadProfile() {
  document.getElementById("studentName").value = data.profile.name;
  document.getElementById("collegeName").value = data.profile.college;
  document.getElementById("rollNumber").value = data.profile.roll;
}

function saveProfile() {

  data.profile.name =
    document.getElementById("studentName").value;

  data.profile.college =
    document.getElementById("collegeName").value;

  data.profile.roll =
    document.getElementById("rollNumber").value;

  saveData();

  alert("Profile saved!");
}

function addSubject() {

  const input = document.getElementById("subjectInput");
  const name = input.value.trim();

  if (!name) {
    alert("Please enter a subject name.");
    return;
  }

  data.subjects.push({
    id: Date.now(),
    name: name,
    present: 0,
    absent: 0,
    history: []
  });

  input.value = "";

  saveData();
  render();
}

function deleteSubject(id) {

  if (!confirm("Delete this subject?")) return;

  data.subjects =
    data.subjects.filter(subject => subject.id !== id);

  saveData();
  render();
}

function markAttendance(id, status) {

  const subject =
    data.subjects.find(subject => subject.id === id);

  if (!subject) return;

  const today = new Date().toISOString().split("T")[0];

  const alreadyMarked =
    subject.history.find(item => item.date === today);

  if (alreadyMarked) {
    alert("Attendance for today is already marked.");
    return;
  }

  if (status === "present") {
    subject.present++;
  } else {
    subject.absent++;
  }

  subject.history.push({
    date: today,
    status: status
  });

  saveData();
  render();
}

function percentage(subject) {

  const total =
    subject.present + subject.absent;

  if (total === 0) return 0;

  return Math.round(
    (subject.present / total) * 100
  );
}

function calculateOverall() {

  let present = 0;
  let total = 0;

  data.subjects.forEach(subject => {
    present += subject.present;
    total += subject.present + subject.absent;
  });

  if (total === 0) return 0;

  return Math.round((present / total) * 100);
}

function render() {

  const container =
    document.getElementById("subjects");

  container.innerHTML = "";

  if (data.subjects.length === 0) {
    container.innerHTML =
      '<div class="empty">No subjects added yet.</div>';
  }

  data.subjects.forEach(subject => {

    const percent = percentage(subject);

    const history =
      subject.history
      .slice()
      .reverse()
      .map(item => `
        <div class="history-item">
          <span>${item.date}</span>
          <strong>
            ${item.status === "present" ? "Present" : "Absent"}
          </strong>
        </div>
      `)
      .join("");

    const div = document.createElement("div");

    div.className = "subject";

    div.innerHTML = `
      <div class="subject-header">

        <div class="subject-name">
          ${subject.name}
        </div>

        <button
          class="delete"
          onclick="deleteSubject(${subject.id})">
          Delete
        </button>

      </div>

      <div class="stats">

        <div class="stat">
          <strong>${subject.present}</strong>
          <span>Present</span>
        </div>

        <div class="stat">
          <strong>${subject.absent}</strong>
          <span>Absent</span>
        </div>

        <div class="stat">
          <strong>${subject.present + subject.absent}</strong>
          <span>Total</span>
        </div>

      </div>

      <div class="percentage">
        ${percent}%
      </div>

      <div class="attendance-buttons">

        <button
          class="present"
          onclick="markAttendance(${subject.id}, 'present')">
          ✓ Present
        </button>

        <button
          class="absent"
          onclick="markAttendance(${subject.id}, 'absent')">
          ✕ Absent
        </button>

      </div>

      <div class="history">

        <strong>Attendance History</strong>

        ${
          history ||
          '<div class="empty">No attendance marked yet.</div>'
        }

      </div>
    `;

    container.appendChild(div);
  });

  const overall = calculateOverall();

  document.getElementById("overall").textContent =
    overall + "%";

  const message =
    document.getElementById("overallMessage");

  if (data.subjects.length === 0) {

    message.className = "empty";
    message.textContent =
      "Add attendance to see your overall percentage.";

  } else if (overall < 75) {

    message.className = "warning";
    message.textContent =
      "⚠️ Attendance is below 75%.";

  } else {

    message.className = "success";
    message.textContent =
      "✓ Attendance is above 75%.";

  }
}

loadProfile();
render();

</script>

</body>
</html>
