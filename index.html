<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classmate — Student Attendance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
    }

    .tagline {
      margin-top: 8px;
      color: #6b7280;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">📚 Classmate</div>
    <div class="tagline">Smart Student Attendance Tracker</div>
  </header>

  <main>
    <div class="card">
      <h2>Student Profile</h2>

      <input type="text" placeholder="Student Name">
      <input type="text" placeholder="College Name">
      <input type="text" placeholder="Roll Number">

      <button>Continue</button>
    </div>
  </main>

</body>
</html>
